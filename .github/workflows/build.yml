name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      flash_dtbo:
        description: "生成 dtbo.img"
        type: boolean
        default: false
      localversion:
        description: "覆盖 localversion，例如 -4k-g1a2b3c4"
        type: string
        default: ""

permissions:
  contents: read

env:
  LLVM_VERSION: "23.1.6"
  CCACHE_DIR: ${{ github.workspace }}/.ccache

jobs:
  build:
    name: 构建内核与卡刷包
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 360
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: 安装构建依赖
        run: |
          set -euo pipefail
          df -h /
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev cpio rsync lz4 zstd \
            python3 zip unzip ccache dwarves git curl

      - name: 配置 zram swap
        run: |
          set -euo pipefail
          mem_mb=$(awk '/MemTotal/{print int($2/1024)}' /proc/meminfo)
          target_mb=$((mem_mb * 2))
          echo "内存 ${mem_mb}M，zram 目标 ${target_mb}M"

          sudo modprobe zram
          sudo zramctl -f -s "${target_mb}M" -a lz4
          sudo mkswap -q /dev/zram0 >/dev/null
          sudo swapon -p 100 /dev/zram0
          free -h
          swapon --show

      - name: 缓存 LLVM 工具链
        id: llvm-cache
        uses: actions/cache@v6
        with:
          path: ~/toolchains/llvm-${{ env.LLVM_VERSION }}-aarch64
          key: llvm-${{ env.LLVM_VERSION }}-aarch64

      - name: 准备 LLVM 工具链
        run: |
          bin_dir=$(scripts/fetch-toolchain.sh ~/toolchains | tail -1)
          echo "CLANG_BIN_DIR=$bin_dir" >> "$GITHUB_ENV"

      - name: 恢复 ccache
        uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ runner.arch }}-llvm${{ env.LLVM_VERSION }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-llvm${{ env.LLVM_VERSION }}-

      - name: 构建内核
        env:
          USE_CCACHE: 1
          KERNEL_LOCALVERSION: ${{ inputs.localversion }}
        run: |
          chmod +x scripts/*.sh
          ccache --max-size=6G
          ccache --zero-stats
          scripts/build.sh

      - name: 显示 ccache 统计
        if: always()
        run: ccache --show-stats || true

      - name: 组装 AnyKernel3 卡刷包
        run: |
          args=()
          if [ "${{ inputs.flash_dtbo }}" = "true" ]; then args+=(--with-dtbo); fi
          scripts/pack_ak3.sh "${args[@]}"

      - name: 列出产物
        run: ls -lh dist/

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: uwuAOSP-KTM-${{ github.run_number }}
          path: dist/*.zip
          if-no-files-found: error
          compression-level: 0
